<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Firmware</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="mb-4 text-center">Upload Firmware</h1>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h5 class="card-title">Server Firmware Version</h5>
                <p class="card-text fs-4 fw-bold">{{ version }}</p>

                <h5 class="card-title">ESP Firmware Versions by DIP</h5>
                {% if esp_version %}
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th scope="col">DIP Value</th>
                                <th scope="col">Firmware Version</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for dip, ver in esp_version.items() %}
                            <tr>
                                <td>{{ dip }}</td>
                                <td class="fw-bold">{{ ver }}</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                {% else %}
                    <p class="text-muted">No firmware versions recorded yet.</p>
                {% endif %}
            </div>
        </div>

        <form action="/upload" method="POST" enctype="multipart/form-data" class="card shadow-sm p-4">
            <div class="mb-3">
                <label for="file" class="form-label">Firmware File (.bin only)</label>
                <input type="file" class="form-control" id="file" name="file" accept=".bin" required>
            </div>

            <div class="mb-3">
                <label for="version" class="form-label">Version Number</label>
                <input type="text" class="form-control" id="version" name="version" placeholder="e.g. 1.0.5" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Select DIP Values</label>
                <div class="form-check mb-2">
                    <input class="form-check-input" type="checkbox" id="selectAll">
                    <label class="form-check-label fw-bold" for="selectAll">Select All</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input dip-checkbox" type="checkbox" name="dip_value" value="00" id="dip00">
                    <label class="form-check-label" for="dip00">00</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input dip-checkbox" type="checkbox" name="dip_value" value="01" id="dip01">
                    <label class="form-check-label" for="dip01">01</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input dip-checkbox" type="checkbox" name="dip_value" value="02" id="dip02">
                    <label class="form-check-label" for="dip02">02</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input dip-checkbox" type="checkbox" name="dip_value" value="03" id="dip03">
                    <label class="form-check-label" for="dip03">03</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input dip-checkbox" type="checkbox" name="dip_value" value="04" id="dip04">
                    <label class="form-check-label" for="dip04">04</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input dip-checkbox" type="checkbox" name="dip_value" value="05" id="dip05">
                    <label class="form-check-label" for="dip05">05</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input dip-checkbox" type="checkbox" name="dip_value" value="06" id="dip06">
                    <label class="form-check-label" for="dip06">06</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input dip-checkbox" type="checkbox" name="dip_value" value="07" id="dip07">
                    <label class="form-check-label" for="dip07">07</label>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Upload Firmware</button>
        </form>

        <div class="text-center mt-4">
            <a href="/" class="btn btn-secondary">Back to Home</a>
        </div>
    </div>

    <script>
        document.getElementById("selectAll").addEventListener("change", function () {
            const checkBoxes = document.querySelectorAll(".dip-checkbox");
            checkBoxes.forEach(cb => cb.checked = this.checked);
        });
    </script>
</body>
</html>
