<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ESP32 OTA Server</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <h1 class="text-center mb-4">ESP32 OTA Server</h1>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h5 class="card-title">Sever Firmware Version</h5>
            <p class="card-text fs-4 fw-bold">{{ version }}</p>

            <h5 class="card-title">ESP Firmware Versions by DIP</h5>
            {% if esp_version %}
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th scope="col">DIP Value</th>
                            <th scope="col">Firmware Version</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for dip, ver in esp_version.items() %}
                        <tr>
                            <td>{{ dip }}</td>
                            <td class="fw-bold">{{ ver }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            {% else %}
                <p class="text-muted">No firmware versions recorded yet.</p>
            {% endif %}
        </div>
    </div>



    <div class="d-flex gap-3 mb-4">
        <a href="/upload" class="btn btn-primary">Upload New Firmware</a>
        <a href="/logs" class="btn btn-secondary">View Logs</a>
    </div>
</div>
</body>
</html>
