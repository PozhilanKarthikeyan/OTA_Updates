<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OTA Logs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light text-dark">
    <div class="container mt-4">
        <h3>Server Logs</h3>

        <pre class="bg-white p-3 border rounded" style="max-height: 500px; overflow-y: auto;">
{% for line in logs %}
{{ line }}
{% endfor %}
        </pre>

        <div class="d-flex gap-3 mb-4">
            <a href="/" class="btn btn-primary">Back to Home</a>
            <a href="/logs" class="btn btn-secondary">Refresh</a>
        </div>
    </div>
</body>
</html>
